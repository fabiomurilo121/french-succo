services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: french_succo
      POSTGRES_USER: succo
      POSTGRES_PASSWORD: succo_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - succo-net

  backend:
    image: french-succo-backend:1.0.2-amd64
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      POSTGRES_CONNECTION: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      MiniMax__ApiKey: ${MINIMAX_API_KEY}
      MiniMax__BaseUrl: ${MINIMAX_BASE_URL}
      MiniMax__TextModel: ${MINIMAX_MODEL}
      MiniMax__Voice: ${MINIMAX_VOICE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - succo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    image: french-succo-frontend:1.0.2-amd64
    restart: unless-stopped
    networks:
      - succo-net

  nginx:
    image: french-succo-proxy:1.0.2-amd64
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - succo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:

networks:
  succo-net:
    driver: bridge
